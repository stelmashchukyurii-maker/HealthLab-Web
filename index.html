<!doctype html>
<html lang="uk">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <meta name="theme-color" content="#08111d" />
  <title>HealthLab · NOOP</title>
  <link rel="stylesheet" href="./style.css" />
</head>
<body>
  <main class="app-shell">
    <header class="topbar">
      <div>
        <div class="eyebrow">HEALTHLAB · NOOP MIRROR</div>
        <h1>Здоров’я</h1>
      </div>
      <button id="refreshBtn" class="icon-btn" aria-label="Оновити">↻</button>
    </header>

    <section class="hero-card">
      <div class="hero-top">
        <div>
          <div class="eyebrow">WHOOP / NOOP</div>
          <div id="deviceName" class="device-name">—</div>
        </div>
        <div id="syncBadge" class="badge">очікування</div>
      </div>
      <div class="hero-metrics">
        <div><span id="liveHr" class="big">—</span><small> bpm</small><div class="label">Пульс</div></div>
        <div><span id="rrCount" class="big">—</span><div class="label">RR записи</div></div>
      </div>
      <div id="lastSeen" class="muted">Останні дані: —</div>
    </section>

    <section class="section-head"><div><div class="eyebrow">БАЗА NOOP</div><h2>Таблиці</h2></div><div id="totalRows" class="summary">—</div></section>
    <section id="tableGrid" class="table-grid"></section>

    <section id="viewer" class="viewer hidden">
      <div class="viewer-head">
        <div><div class="eyebrow">ТАБЛИЦЯ</div><h2 id="viewerTitle">—</h2></div>
        <button id="closeViewer" class="ghost">Закрити</button>
      </div>
      <div id="viewerMeta" class="muted"></div>
      <div id="rows" class="rows"></div>
    </section>

    <div id="status" class="status">Підключення…</div>
  </main>

  <nav class="bottom-nav">
    <button class="nav-item active"><span>⌂</span><b>Огляд</b></button>
    <button class="nav-item" id="dbNav"><span>▦</span><b>База</b></button>
    <button class="nav-item"><span>♡</span><b>HealthLab</b></button>
  </nav>
  <script src="./app.js"></script>
</body>
</html>
