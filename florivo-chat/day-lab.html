<!doctype html><html lang="uk"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,maximum-scale=1"><meta name="theme-color" content="#07101b"><meta name="color-scheme" content="dark"><title>Florivo · День</title><style>
*{box-sizing:border-box}html,body{margin:0;background:#07101b;color:#eef4ff;font-family:system-ui,-apple-system,Segoe UI,sans-serif;min-height:100%}body{background:radial-gradient(circle at 50% 0,#10203a 0,#07101b 38%,#050b13 100%)}.shell{max-width:760px;margin:auto;padding:10px 10px 34px}.head{position:sticky;top:0;z-index:12;background:rgba(7,16,27,.95);backdrop-filter:blur(14px);padding:9px 2px 10px;border-bottom:1px solid #1b2a3d}.eyebrow{font-size:10px;letter-spacing:.17em;color:#91a4c4;font-weight:800}.title{font-size:27px;font-weight:850;margin:2px 0 8px}.nav{display:grid;grid-template-columns:42px 1fr 42px;gap:8px}.nav button,.today{border:1px solid #263853;background:#111c2e;color:#eef4ff;border-radius:12px;height:40px;font-weight:800}.date{text-align:center;border:1px solid #263853;background:#0d1727;border-radius:12px;display:grid;place-items:center;font-size:14px;font-weight:800}.today{width:100%;height:32px;margin-top:7px;color:#cbd7e8;font-size:12px}.legend{display:flex;gap:12px;padding:9px 4px 4px;color:#778ba8;font-size:10px}.legend b{color:#d9e6f7}.stage{position:relative;margin-top:4px;min-height:1000px}.axis{position:absolute;left:48px;top:10px;bottom:28px;width:1px;background:#2b4762}.hour{position:absolute;left:0;width:40px;text-align:right;color:#667b98;font-size:9px;transform:translateY(-6px)}.line{position:absolute;left:45px;right:3px;border-top:1px solid rgba(105,129,160,.12)}.item{position:absolute;left:61px;right:4px;min-height:23px;border-radius:7px;padding:4px 7px;font-size:10px;overflow:hidden}.phys{border-left:3px solid #287cf6;background:linear-gradient(90deg,rgba(37,112,225,.25),rgba(21,42,66,.12));color:#cfe2ff}.sleep{border-left:4px solid #7b6cf4;background:linear-gradient(90deg,rgba(86,72,196,.34),rgba(26,33,61,.18));color:#e8e5ff}.event{border-left:3px solid #ffad42;background:#132033;color:#f2f6fc}.gap{border:1px dashed #41536c;background:repeating-linear-gradient(135deg,rgba(80,96,118,.08) 0 7px,transparent 7px 14px);color:#75869e}.now{position:absolute;left:43px;right:3px;height:1px;background:#aa5cff;z-index:8}.now:before{content:"";position:absolute;left:1px;top:-4px;width:9px;height:9px;border-radius:50%;background:#aa5cff}.now span{position:absolute;left:18px;top:-8px;background:#07101b;color:#c47cff;font-size:9px;font-weight:900;padding:0 4px}.status{padding:18px 10px;text-align:center;color:#8192aa;font-size:12px}.foot{text-align:center;color:#52647b;font-size:9px;padding:4px 8px 18px}.pill{display:inline-block;border:1px solid #263853;border-radius:999px;padding:3px 7px;margin-left:5px}.bad{color:#e9a9a9}
</style></head><body><main class="shell"><header class="head"><div class="eyebrow">FLORIVO · 24/7</div><div class="title">День</div><div class="nav"><button id="prev">‹</button><div id="date" class="date">—</div><button id="next">›</button></div><button id="today" class="today">Сьогодні</button></header><div class="legend"><span><b>▌</b> HealthLab</span><span>● подія</span><span>··· немає даних</span></div><div id="status" class="status">Завантажую DAY…</div><section id="stage" class="stage" hidden></section><div class="foot">DAY V0.1 · read-only · Local Gateway /range</div></main><script>
(()=>{"use strict";const BASE="http://127.0.0.1:18765",PX=58,LIMIT=5000,MAX=40;let off=0;
const $=id=>document.getElementById(id),norm=t=>Number(t)<1e12?Number(t)*1000:Number(t),hm=t=>new Date(norm(t)).toLocaleTimeString("uk-UA",{hour:"2-digit",minute:"2-digit"}),esc=s=>String(s??"").replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
function win(){const n=new Date(),d=new Date(n.getFullYear(),n.getMonth(),n.getDate()+off),e=new Date(d.getFullYear(),d.getMonth(),d.getDate()+1);return{d,e,from:Math.floor(d/1000),to:off===0?Math.floor(Date.now()/1000):Math.floor(e/1000)}}
async function lf(url){const once=async o=>{const a=new AbortController(),tm=setTimeout(()=>a.abort(),9000);try{return await fetch(url,{...o,cache:"no-store",signal:a.signal})}finally{clearTimeout(tm)}};try{return await once({targetAddressSpace:"loopback"})}catch(e){if(e?.name==="AbortError")throw e;return once({})}}
async function rows(table,from,to){let out=[],ct=null,cr=null;for(let p=0;p<MAX;p++){const u=new URL(BASE+"/range");u.searchParams.set("table",table);u.searchParams.set("from",from);u.searchParams.set("to",to);u.searchParams.set("limit",LIMIT);if(ct!=null){u.searchParams.set("cursor_ts",ct);u.searchParams.set("cursor_rowid",cr)}const r=await lf(u),j=await r.json();if(!r.ok||j.ok!==true)throw Error(table);out.push(...(j.rows||[]));if(!j.has_more)break;ct=j.next_cursor_ts;cr=j.next_cursor_rowid;if(ct==null)break}return out}
const y=m=>10+m/60*PX,mins=(t,d)=>((norm(t)-d.getTime())/60000);
function gaps(hr,w){const ts=hr.map(x=>norm(x.ts)).filter(Number.isFinite).sort((a,b)=>a-b),out=[];let p=w.d.getTime(),end=w.to*1000;for(const t of ts){if(t-p>35*60000)out.push([p,t]);p=Math.max(p,t+300000)}if(end-p>35*60000)out.push([p,end]);return out}
function physRuns(hr,w){const bins=new Map();for(const x of hr){const t=norm(x.ts),v=Number(x.bpm);if(!Number.isFinite(t)||!Number.isFinite(v))continue;const k=Math.floor(t/900000)*900000,b=bins.get(k)||{t:k,n:0,s:0};b.n++;b.s+=v;bins.set(k,b)}return[...bins.values()].map(b=>({t:b.t,v:Math.round(b.s/b.n)})).sort((a,b)=>a.t-b.t)}
function eventLabel(x){return x.title||x.event_type||x.type||x.name||"Подія"}
async function load(){const w=win();$("date").textContent=w.d.toLocaleDateString("uk-UA",{weekday:"short",day:"2-digit",month:"2-digit"});$("next").disabled=off>=0;$("status").hidden=false;$("stage").hidden=true;$("status").className="status";$("status").textContent="Завантажую DAY…";try{await lf(BASE+"/health");const [hr,ev,sl]=await Promise.all([rows("hrSample",w.from,w.to),rows("event",w.from,w.to).catch(()=>[]),rows("sleepSession",w.from,w.to).catch(()=>[])]);render(w,hr,ev,sl)}catch(e){$("status").className="status bad";$("status").innerHTML="Local Gateway недоступний.<br><span class=pill>DAY не вигадує дані</span>"}}
function render(w,hr,ev,sl){const st=$("stage"),height=24*PX+38;let h='<div class="axis"></div>';for(let i=0;i<=24;i++){const yy=y(i*60);h+='<div class="hour" style="top:'+yy+'px">'+String(i).padStart(2,"0")+':00</div><div class="line" style="top:'+yy+'px"></div>'}
for(const g of gaps(hr,w)){const top=y(Math.max(0,mins(g[0],w.d))),bot=y(Math.min(1440,mins(g[1],w.d)));if(bot-top>20)h+='<div class="item gap" style="top:'+top+'px;height:'+(bot-top)+'px">··· немає даних</div>'}
for(const p of physRuns(hr,w)){const top=y(mins(p.t,w.d));h+='<div class="item phys" style="top:'+top+'px;height:23px">▌ HR '+p.v+' bpm · '+hm(p.t)+'</div>'}
for(const s of sl){const a=norm(s.start_ts??s.startTs??s.ts),b=norm(s.end_ts??s.endTs??s.end??a+3600000);if(!Number.isFinite(a))continue;const top=y(Math.max(0,mins(a,w.d))),bot=y(Math.min(1440,mins(b,w.d)));h+='<div class="item sleep" style="top:'+top+'px;height:'+Math.max(25,bot-top)+'px">☾ Сон · '+hm(a)+'–'+hm(b)+'</div>'}
let last=-99;for(const e of ev){const t=norm(e.occurred_at??e.ts??e.timestamp);if(!Number.isFinite(t))continue;let top=y(mins(t,w.d));if(top-last<18)top=last+18;last=top;h+='<div class="item event" style="top:'+top+'px">● '+esc(eventLabel(e))+' · '+hm(t)+'</div>'}
if(off===0){const top=y((Date.now()-w.d.getTime())/60000);h+='<div class="now" style="top:'+top+'px"><span>'+hm(Date.now())+' ЗАРАЗ</span></div>'}
st.style.height=height+"px";st.innerHTML=h;st.hidden=false;$("status").hidden=true;if(off===0)requestAnimationFrame(()=>window.scrollTo({top:Math.max(0,y((Date.now()-w.d.getTime())/60000)-innerHeight*.48),behavior:"auto"}))}
$("prev").onclick=()=>{off--;load()};$("next").onclick=()=>{if(off<0){off++;load()}};$("today").onclick=()=>{off=0;load()};load();
})();
</script></body></html>
