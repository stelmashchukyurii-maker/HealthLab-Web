<!doctype html><html lang="uk"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="color-scheme" content="dark"><title>Florivo · День</title><style>
*{box-sizing:border-box}html,body{margin:0;background:#07101b;color:#eef4ff;font-family:system-ui,-apple-system,Segoe UI,sans-serif;min-height:100%}.shell{max-width:760px;margin:auto;padding:10px 10px 34px}.head{position:sticky;top:0;z-index:5;background:#07101bf2;padding:9px 2px 10px;border-bottom:1px solid #1b2a3d}.eyebrow{font-size:10px;letter-spacing:.17em;color:#91a4c4;font-weight:800}.title{font-size:27px;font-weight:850;margin:2px 0 8px}.nav{display:grid;grid-template-columns:42px 1fr 42px;gap:8px}.nav button,.today{border:1px solid #263853;background:#111c2e;color:#eef4ff;border-radius:12px;height:40px;font-weight:800}.date{text-align:center;border:1px solid #263853;background:#0d1727;border-radius:12px;display:grid;place-items:center;font-size:14px;font-weight:800}.today{width:100%;height:32px;margin-top:7px;color:#cbd7e8;font-size:12px}.status{padding:24px 10px;text-align:center;color:#91a4c4;font-size:12px;line-height:1.5}.ok{color:#9ed9b0}.bad{color:#e9a9a9}.stage{position:relative;min-height:1000px;margin-top:8px}.axis{position:absolute;left:48px;top:10px;bottom:28px;width:1px;background:#2b4762}.hour{position:absolute;left:0;width:40px;text-align:right;color:#667b98;font-size:9px;transform:translateY(-6px)}.line{position:absolute;left:45px;right:3px;border-top:1px solid #6981a01f}.item{position:absolute;left:61px;right:4px;min-height:28px;border-radius:7px;padding:5px 8px;font-size:10px;overflow:hidden;border-left:4px solid #ffad42;background:#132033}.plan{border-left-color:#52a8ff}.fact{border-left-color:#62d08b}.inference{border-left-color:#b786ff}.recommendation{border-left-color:#ffb84d}.now{position:absolute;left:43px;right:3px;height:1px;background:#aa5cff;z-index:3}.now:before{content:"";position:absolute;left:1px;top:-4px;width:9px;height:9px;border-radius:50%;background:#aa5cff}.now span{position:absolute;left:18px;top:-8px;background:#07101b;color:#c47cff;font-size:9px;font-weight:900;padding:0 4px}.legend{display:flex;gap:10px;flex-wrap:wrap;padding:9px 4px 2px;color:#778ba8;font-size:10px}.foot{text-align:center;color:#52647b;font-size:9px;padding:10px}.account{font-size:9px;color:#60738d;text-align:center;padding-top:5px}
</style></head><body><main class="shell"><header class="head"><div class="eyebrow">FLORIVO · TIMELINE</div><div class="title">День</div><div class="nav"><button id="prev">‹</button><div id="date" class="date">—</div><button id="next">›</button></div><button id="today" class="today">Сьогодні</button><div id="account" class="account"></div><button id="quickAdd" type="button" style="width:100%;height:38px;margin-top:8px;border:1px solid #355070;border-radius:12px;background:#13243a;color:#eef4ff;font-weight:800">＋ Додати запис</button></header><div class="legend"><span>▌ PLAN</span><span>▌ FACT</span><span>▌ INFERENCE</span><span>▌ RECOMMENDATION</span></div><div id="status" class="status">Підключаю Timeline…</div><section id="stage" class="stage" hidden></section><div class="foot">DAY V0.2 · Supabase Timeline · protected by account</div></main>
<script type="module">
import{createClient}from"https://esm.sh/@supabase/supabase-js@2";
const URL="https://ttvlgfzvgjcbomdlddbn.supabase.co",KEY="sb_publishable_30IrLFbkHE4cPXmu-hJoQA_u_sFSg3Y",PX=58;const sb=createClient(URL,KEY,{auth:{persistSession:true,autoRefreshToken:true,detectSessionInUrl:false}});let off=0;
const $=id=>document.getElementById(id),esc=s=>String(s??"").replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
function day(){const n=new Date(),d=new Date(n.getFullYear(),n.getMonth(),n.getDate()+off),e=new Date(d.getFullYear(),d.getMonth(),d.getDate()+1);return{d,e}}
function y(min){return 10+min/60*PX} function minute(t,d){return(new Date(t)-d)/60000} function hm(t){return new Date(t).toLocaleTimeString("uk-UA",{hour:"2-digit",minute:"2-digit"})}
async function load(){const w=day();$("date").textContent=w.d.toLocaleDateString("uk-UA",{weekday:"short",day:"2-digit",month:"2-digit"});$("next").disabled=off>=0;$("status").hidden=false;$("stage").hidden=true;$("status").className="status";$("status").textContent="Підключаю Timeline…";
 const{data:{session}}=await sb.auth.getSession();if(!session){$("account").textContent="";$("status").className="status bad";$("status").innerHTML="Timeline не авторизований.<br>Повернись у 💬 Chat і увійди в Florivo.";return}
 $("account").textContent=session.user.email||"Florivo account";
 const{data,error}=await sb.from("hl_timeline_item").select("id,truth_kind,category,title,start_at,end_at,status").gte("start_at",w.d.toISOString()).lt("start_at",w.e.toISOString()).is("deleted_at",null).order("start_at");
 if(error){$("status").className="status bad";$("status").textContent="Timeline: "+error.message;return} render(w,data||[]);
}
function render(w,items){const st=$("stage");let h='<div class="axis"></div>';for(let i=0;i<=24;i++){const yy=y(i*60);h+='<div class="hour" style="top:'+yy+'px">'+String(i).padStart(2,"0")+':00</div><div class="line" style="top:'+yy+'px"></div>'}
 for(const x of items){const a=Math.max(0,Math.min(1439,minute(x.start_at,w.d))),b=x.end_at?Math.max(a+28/PX*60,Math.min(1440,minute(x.end_at,w.d))):a+30;const top=y(a),height=Math.max(28,y(b)-top);const kind=String(x.truth_kind||"FACT").toLowerCase();h+='<div class="item '+kind+'" style="top:'+top+'px;height:'+height+'px"><b>'+esc(x.truth_kind)+'</b> · '+esc(x.title)+' · '+hm(x.start_at)+'</div>'}
 if(off===0){const m=(Date.now()-w.d)/60000,top=y(m);h+='<div class="now" style="top:'+top+'px"><span>'+hm(Date.now())+' ЗАРАЗ</span></div>'}
 st.style.height=(24*PX+38)+"px";st.innerHTML=h;st.hidden=false;$("status").hidden=items.length>0;if(!items.length){$("status").className="status ok";$("status").innerHTML="✓ Timeline підключений.<br>На цей день записів ще немає."}
}
$("quickAdd").onclick=async()=>{const title=prompt("Що записати в Timeline?");if(!title?.trim())return;const{data:{session}}=await sb.auth.getSession();if(!session){alert("Потрібно увійти у Florivo Chat.");return}const w=day(),start=off===0?new Date():new Date(w.d.getFullYear(),w.d.getMonth(),w.d.getDate(),12,0);const{error}=await sb.from("hl_timeline_item").insert({owner_id:session.user.id,truth_kind:"FACT",category:"OTHER",title:title.trim(),start_at:start.toISOString(),timezone:"Europe/Oslo",source_type:"USER"});if(error){alert("Не вдалося зберегти: "+error.message);return}load()};$("prev").onclick=()=>{off--;load()};$("next").onclick=()=>{if(off<0){off++;load()}};$("today").onclick=()=>{off=0;load()};sb.auth.onAuthStateChange(()=>setTimeout(load,0));load();
</script></body></html>
