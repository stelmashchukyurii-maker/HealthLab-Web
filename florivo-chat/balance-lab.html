<!doctype html><html lang="uk"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="color-scheme" content="dark"><title>Баланс систем</title><style>*{box-sizing:border-box}body{margin:0;background:radial-gradient(circle at 50% 10%,#132238 0,#07101d 48%,#03070d 100%);color:#f5f7fb;font-family:system-ui,-apple-system,Segoe UI,sans-serif;min-height:100vh}.wrap{max-width:760px;margin:auto;padding:22px 16px 38px}.head{text-align:center;margin-bottom:24px}.head h1{font-size:24px;margin:0 0 5px}.head p{margin:0;color:#8fa2bd;font-size:13px}.axes{display:grid;grid-template-columns:1fr 1fr;gap:18px}.axis{text-align:center}.axis h2{font-size:18px;margin:0 0 3px}.axis small{color:#8fa2bd}.battery{position:relative;width:min(150px,38vw);height:330px;margin:28px auto 16px;border:3px solid #8da0b7;border-radius:38px 38px 30px 30px;background:linear-gradient(90deg,rgba(255,255,255,.12),rgba(255,255,255,.02) 20%,rgba(255,255,255,.09) 52%,rgba(255,255,255,.01) 78%,rgba(255,255,255,.13));box-shadow:inset 0 0 22px #000,0 18px 30px #0009;overflow:visible}.battery:before{content:"";position:absolute;top:-22px;left:31%;width:38%;height:22px;border:3px solid #8da0b7;border-bottom:0;border-radius:12px 12px 3px 3px;background:linear-gradient(#d9e2ec,#4e6076)}.battery:after{content:"";position:absolute;inset:7px;border-radius:29px 29px 22px 22px;box-shadow:inset 8px 0 12px #fff2,inset -8px 0 12px #0008;pointer-events:none}.fill{position:absolute;left:7px;right:7px;bottom:7px;height:calc(var(--v)*1% - 14px);min-height:10px;border-radius:22px 22px 20px 20px;background:linear-gradient(90deg,#0b7b35,#42f06d 42%,#10a848);box-shadow:0 0 24px #24e85b88,inset 0 8px 15px #fff4;overflow:visible}.stress .fill{background:linear-gradient(90deg,#9b4207,#ffb12e 42%,#e46a08);box-shadow:0 0 24px #ff941a77,inset 0 8px 15px #fff4}.fill:before{content:"";position:absolute;left:0;right:0;top:-7px;height:15px;border-radius:50%;background:#65ff84;box-shadow:0 0 15px #54ff7c}.stress .fill:before{background:#ffc04b;box-shadow:0 0 15px #ff9f23}.num{position:absolute;left:0;right:0;top:50%;transform:translateY(-50%);font-size:36px;font-weight:800;text-shadow:0 2px 8px #000}.scale{position:absolute;left:-32px;top:0;height:100%;display:flex;flex-direction:column;justify-content:space-between;color:#8397b1;font-size:11px;padding:1px 0}.state{font-weight:700;font-size:15px}.good{color:#55ef77}.low{color:#ffad35}.balance{margin-top:28px;border:1px solid #253750;background:#09121fcc;border-radius:20px;padding:18px}.balance strong{font-size:17px}.track{height:16px;border-radius:99px;margin:14px 0 8px;background:linear-gradient(90deg,#26d95b 0 55%,#f1c43d 70%,#f08a20 100%);box-shadow:inset 0 0 0 2px #26384d}.marker{width:3px;height:27px;background:white;margin:-22px 0 0 58%;box-shadow:0 0 7px white}.note{text-align:center;color:#8fa2bd;font-size:12px;margin-top:10px}.demo{text-align:center;color:#60758f;font-size:11px;margin-top:20px}@media(max-width:420px){.wrap{padding-left:10px;padding-right:10px}.axes{gap:7px}.battery{height:280px}.axis h2{font-size:16px}.num{font-size:30px}}</style></head><body><main class="wrap"><header class="head"><h1>Баланс систем</h1><p>Дві незалежні фізіологічні осі · концепт</p></header><section class="axes"><article class="axis"><h2>Відновлення</h2><small>ресурс · відбудова · енергія</small><div class="battery" style="--v:78"><div class="scale"><span>100</span><span>75</span><span>50</span><span>25</span><span>0</span></div><div class="fill"><div class="num">78%</div></div></div><div class="state good">● Добрий рівень</div></article><article class="axis stress"><h2>Стрес</h2><small>напруга · навантаження</small><div class="battery" style="--v:28"><div class="scale"><span>100</span><span>75</span><span>50</span><span>25</span><span>0</span></div><div class="fill"><div class="num">28%</div></div></div><div class="state low">● Низький рівень</div></article></section><section class="balance"><strong>Баланс систем</strong><div class="track"></div><div class="marker"></div><div class="note">Відновлення переважає · баланс у нормі</div></section><div class="demo">ДЕМО · значення 78 / 28 поки не з реальних даних</div></main></body></html>
