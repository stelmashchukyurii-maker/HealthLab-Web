<!doctype html><html lang="uk"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Health Mirror Range Test</title><style>body{font-family:system-ui;background:#0b0d10;color:#eef2f5;margin:0;padding:18px}button{font:inherit;padding:14px;width:100%;border-radius:12px}.ok{color:#55d98b}.bad{color:#ff7a7a}pre{background:#101419;padding:12px;border-radius:10px;white-space:pre-wrap;overflow-wrap:anywhere}</style></head><body><h2>Health Mirror READ-ONLY test</h2><p>HR · останні 24 години · LIMIT 20</p><button id="go">Перевірити</button><p id="status">Готово до тесту</p><pre id="out">—</pre><script>
const BASE='http://127.0.0.1:18765',st=document.querySelector('#status'),out=document.querySelector('#out'),go=document.querySelector('#go');
async function lf(p){try{return await fetch(BASE+p,{cache:'no-store',targetAddressSpace:'loopback'})}catch(e){return fetch(BASE+p,{cache:'no-store'})}}
go.onclick=async()=>{go.disabled=true;st.textContent='Читаю...';st.className='';try{const to=Math.floor(Date.now()/1000),from=to-86400;const r=await lf('/mirror/range?kind=HR&from='+from+'&to='+to+'&limit=20');const j=await r.json();out.textContent=JSON.stringify(j,null,2);st.textContent=j.ok?'PASS · отримано '+j.count+' рядків':'FAIL · '+(j.error||r.status);st.className=j.ok?'ok':'bad'}catch(e){st.textContent='FAIL';st.className='bad';out.textContent=String(e)}finally{go.disabled=false}};
</script></body></html>
