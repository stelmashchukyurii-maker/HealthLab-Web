<!doctype html><html lang="uk"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>HealthLab /range inventory</title><style>body{font-family:system-ui;background:#0b0d10;color:#eef2f5;padding:16px}button{font:inherit;padding:13px;width:100%}pre{white-space:pre-wrap;background:#111820;padding:12px;border-radius:10px}</style></head><body><h2>/range inventory · 24h</h2><button id="run">RUN INVENTORY</button><pre id="out">Ready</pre><script>
const BASE='http://127.0.0.1:18765',tables=['hrSample','ppgHrSample','rrInterval','event','battery','spo2Sample','skinTempSample','stepSample','sleepStateSample','respSample','gravitySample'],out=document.querySelector('#out');
async function lf(url){try{return await fetch(url,{cache:'no-store',targetAddressSpace:'loopback'})}catch(e){return fetch(url,{cache:'no-store'})}}
document.querySelector('#run').onclick=async()=>{const to=Math.floor(Date.now()/1000),from=to-86400,res=[];out.textContent='Running…';for(const table of tables){try{const u=new URL(BASE+'/range');u.searchParams.set('table',table);u.searchParams.set('from',from);u.searchParams.set('to',to);u.searchParams.set('limit','1');const r=await lf(u),j=await r.json();res.push({table,ok:r.ok&&j.ok===true,count:j.count||0,has_more:!!j.has_more,sample:(j.rows||[])[0]||null})}catch(e){res.push({table,ok:false,error:String(e)})}out.textContent=JSON.stringify({from,to,results:res},null,2)};</script></body></html>
