<!doctype html><html lang="uk"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>HealthLab /range inventory</title><style>body{font-family:system-ui;background:#0b0d10;color:#eef2f5;padding:16px}button{font:inherit;padding:13px;width:100%}pre{white-space:pre-wrap;background:#111820;padding:12px;border-radius:10px}</style></head><body><h2>/range inventory · 24h</h2><button id="run" type="button" onclick="runInventory()">RUN INVENTORY</button><pre id="out">Ready · tap RUN INVENTORY</pre><script>
var BASE='http://127.0.0.1:18765',tables=['hrSample','ppgHrSample','rrInterval','event','battery','spo2Sample','skinTempSample','stepSample','sleepStateSample','respSample','gravitySample'];var out=document.getElementById('out');
function lf(url){try{return fetch(url,{cache:'no-store',targetAddressSpace:'loopback'});}catch(e){return fetch(url,{cache:'no-store'});}}
function runInventory(){out.textContent='Tapped · JS OK · running…';var to=Math.floor(Date.now()/1000),from=to-86400,res=[],i=0;function next(){if(i>=tables.length){out.textContent=JSON.stringify({from:from,to:to,results:res},null,2);return;}var table=tables[i++],u=BASE+'/range?table='+encodeURIComponent(table)+'&from='+from+'&to='+to+'&limit=1';out.textContent='JS OK · testing '+table+' ('+i+'/'+tables.length+')';lf(u).then(function(r){return r.json().then(function(j){res.push({table:table,ok:r.ok&&j.ok===true,count:j.count||0,has_more:!!j.has_more,sample:(j.rows||[])[0]||null});next();});}).catch(function(e){res.push({table:table,ok:false,error:String(e)});next();});}next();} window.runInventory=runInventory;</script></body></html>
