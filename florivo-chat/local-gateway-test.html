<!doctype html><html lang="uk"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Florivo Local Gateway Test</title><style>body{font-family:system-ui;background:#0b0d10;color:#eef2f5;margin:0;padding:18px}button{font:inherit;padding:12px;margin:5px 0;width:100%;border-radius:10px}.ok{color:#55d98b}.bad{color:#ff7a7a}.warn{color:#ffd166}.live{font-size:32px;font-weight:700}.diag,pre{background:#101419;padding:10px 12px;border-radius:10px;white-space:pre-wrap}</style></head><body><h2>FLORIVO - Local Gateway</h2><p id="status">Перевіряю...</p><div class="diag" id="diag">PWA: запуск...</div><div class="diag" id="collector">WHOOP: перевіряю...</div><button id="ping">Перевірити / відновити</button><p id="ws">WS: запуск...</p><div class="live" id="bpm">- BPM</div><pre id="out">-</pre><script>
const BASE='http://127.0.0.1:18765',WSURL='ws://127.0.0.1:18765/live',status=document.querySelector('#status'),diag=document.querySelector('#diag'),collector=document.querySelector('#collector'),ws=document.querySelector('#ws'),bpm=document.querySelector('#bpm'),out=document.querySelector('#out');let sock=null,start=Date.now(),lastPacket=0,lastHrTs=0,reconnect=0,gateway=false,connected=null,busy=false,timer=null;const fmt=s=>{s=Math.max(0,Math.floor(s));return s<60?s+'с':Math.floor(s/60)+'хв '+s%60+'с'},norm=t=>Number(t)>0&&Number(t)<1e12?Number(t)*1000:Number(t)||0,age=()=>lastHrTs?Math.max(0,(Date.now()-norm(lastHrTs))/1000):null;async function lf(p){try{return await fetch(BASE+p,{cache:'no-store',targetAddressSpace:'loopback'})}catch(e){return fetch(BASE+p,{cache:'no-store'})}}async function health(){try{let r=await lf('/health'),j=await r.json();gateway=!!j.ok;status.textContent=gateway?'LOCAL OK - noop_whoop.db':'Gateway error';status.className=gateway?'ok':'bad';return gateway}catch(e){gateway=false;status.textContent='Немає з’єднання з HealthLab localhost';status.className='bad';return false}}async function ensure(show=false){if(busy)return;busy=true;try{let r=await lf('/ensure-live'),j=await r.json();connected=!!j.connected;if(j.hrDataTs>0)lastHrTs=j.hrDataTs;if(j.latestDbBpm>=0)bpm.textContent=j.latestDbBpm+' BPM';collector.textContent='WHOOP: '+(connected?'CONNECTED':'RECOVERY')+' · HR data age: '+(j.hrDataAgeSec>=0?fmt(j.hrDataAgeSec):'—');collector.className='diag '+(connected&&j.hrDataAgeSec>=0&&j.hrDataAgeSec<30?'ok':'warn');if(show)out.textContent=JSON.stringify(j,null,2)}catch(e){connected=false;collector.textContent='WHOOP: ensure-live помилка';collector.className='diag bad';if(show)out.textContent=String(e)}finally{busy=false}}async function connect(){if(sock&&(sock.readyState===0||sock.readyState===1))return;if(!await health()){ws.textContent='WS: GATEWAY НЕДОСТУПНИЙ';ws.className='bad';timer=setTimeout(connect,3000);return}await ensure();try{let s=new WebSocket(WSURL);sock=s;s.onopen=()=>{ws.textContent='WS: ПІДКЛЮЧЕНО';ws.className='ok'};s.onmessage=e=>{lastPacket=Date.now();try{let j=JSON.parse(e.data);out.textContent=JSON.stringify(j,null,2);if(j.row){if(j.row.bpm!=null)bpm.textContent=j.row.bpm+' BPM';if(j.row.ts!=null)lastHrTs=j.row.ts}}catch(x){}};s.onclose=()=>{if(sock===s)sock=null;reconnect++;if(!document.hidden)timer=setTimeout(connect,1500)};s.onerror=()=>{ws.textContent='WS: ПОМИЛКА';ws.className='bad'}}catch(e){timer=setTimeout(connect,3000)}}async function recover(){if(document.hidden)return;if(await health()){await ensure();connect()}}ping.onclick=async()=>{if(await health()){await ensure(true);connect()}};document.addEventListener('visibilitychange',()=>{if(!document.hidden)recover()});window.addEventListener('pageshow',recover);window.addEventListener('online',recover);setInterval(()=>{let a=age();diag.textContent='PWA: '+fmt((Date.now()-start)/1000)+' · Gateway: '+(gateway?'OK':'?')+' · WS: '+(sock&&sock.readyState===1?'ON':'OFF')+' · WS пакет: '+(lastPacket?fmt((Date.now()-lastPacket)/1000):'—')+' · HR age: '+(a==null?'—':fmt(a))+' · reconnect: '+reconnect;if(a!=null){collector.textContent='WHOOP: '+(connected?'CONNECTED':'RECOVERY')+' · HR data age: '+fmt(a);collector.className='diag '+(connected&&a<30?'ok':a<60?'warn':'bad')}if(a!=null&&a>30&&gateway&&!document.hidden)ensure()},1000);(async()=>{if(await health())await ensure();connect()})();</script></body></html>
