<!doctype html>
<html lang="uk"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Florivo Local Gateway Test</title>
<style>body{font-family:system-ui;background:#0b0d10;color:#eef2f5;margin:0;padding:18px}button,select{font:inherit;padding:12px;margin:5px 0;width:100%;border-radius:10px}pre{white-space:pre-wrap;overflow-wrap:anywhere;background:#15191e;padding:12px;border-radius:10px}.ok{color:#55d98b}.bad{color:#ff7a7a}.warn{color:#ffd166}.live{font-size:32px;font-weight:700;margin:10px 0}.diag{font-size:14px;line-height:1.55;background:#101419;padding:10px 12px;border-radius:10px;margin:10px 0}</style></head><body>
<h2>FLORIVO - Local Gateway</h2><p id="status">Перевіряю localhost...</p>
<div class="diag" id="diag">PWA: запуск...</div>
<button id="ping">1. Перевірити HealthLab localhost</button><button id="tables">2. Показати локальні таблиці</button>
<select id="table"><option>hrSample</option><option>rrInterval</option><option>spo2Sample</option><option>respSample</option><option>gravitySample</option><option>sleepSession</option><option>dailyMetric</option><option>event</option></select>
<button id="read">3. Показати 20 рядків</button><button id="live">4. Перепідключити Live HR</button><p id="ws">WS: запуск...</p><div class="live" id="bpm">- BPM</div><pre id="out">-</pre>
<script>
const BASE='http://127.0.0.1:18765',WSURL='ws://127.0.0.1:18765/live';
const out=document.querySelector('#out'),status=document.querySelector('#status'),ws=document.querySelector('#ws'),bpm=document.querySelector('#bpm'),diag=document.querySelector('#diag');
let sock=null,reconnectTimer=null,reconnectCount=0,lastPacketAt=0,wsOpenedAt=0,pageStartedAt=Date.now(),gatewayOK=false,wantLive=true;
const fmt=s=>{s=Math.max(0,Math.floor(s));return s<60?s+'с':Math.floor(s/60)+'хв '+(s%60)+'с'};
async function lf(p){try{return await fetch(BASE+p,{cache:'no-store',targetAddressSpace:'loopback'})}catch(e){return fetch(BASE+p,{cache:'no-store'})}}
async function health(showOutput=false){try{const r=await lf('/health');if(!r.ok)throw new Error('HTTP '+r.status);const j=await r.json();gatewayOK=!!j.ok;status.textContent=gatewayOK?'LOCAL OK - noop_whoop.db':'Local Gateway error';status.className=gatewayOK?'ok':'bad';if(showOutput)out.textContent=JSON.stringify(j,null,2);return gatewayOK}catch(e){gatewayOK=false;status.textContent='Немає з’єднання з HealthLab localhost';status.className='bad';if(showOutput)out.textContent=String(e);return false}}
async function run(p){try{const r=await lf(p),j=await r.json();out.textContent=JSON.stringify(j,null,2);gatewayOK=!!j.ok;status.textContent=gatewayOK?'LOCAL OK - noop_whoop.db':'Local Gateway error';status.className=gatewayOK?'ok':'bad'}catch(e){gatewayOK=false;status.textContent='Немає з’єднання з HealthLab localhost';status.className='bad';out.textContent=String(e)}}
function scheduleReconnect(delay=1000){if(!wantLive||document.hidden||reconnectTimer)return;reconnectTimer=setTimeout(()=>{reconnectTimer=null;connectLive(false)},delay)}
async function connectLive(manual=false){wantLive=true;if(reconnectTimer){clearTimeout(reconnectTimer);reconnectTimer=null}if(sock&&(sock.readyState===WebSocket.OPEN||sock.readyState===WebSocket.CONNECTING))return;if(manual)reconnectCount=0;const ok=await health(false);if(!ok){ws.textContent='WS: GATEWAY НЕДОСТУПНИЙ';ws.className='bad';scheduleReconnect(3000);return}ws.textContent='WS: з’єднуюсь...';ws.className='warn';try{const s=new WebSocket(WSURL);sock=s;s.onopen=()=>{if(sock!==s)return;wsOpenedAt=Date.now();ws.textContent='WS: ПІДКЛЮЧЕНО';ws.className='ok'};s.onmessage=e=>{if(sock!==s)return;lastPacketAt=Date.now();try{const j=JSON.parse(e.data);out.textContent=JSON.stringify(j,null,2);if(j.row&&j.row.bpm!=null)bpm.textContent=j.row.bpm+' BPM'}catch(x){out.textContent=e.data}};s.onerror=()=>{if(sock!==s)return;ws.textContent='WS: ПОМИЛКА';ws.className='bad'};s.onclose=()=>{if(sock===s)sock=null;if(!wantLive)return;reconnectCount++;ws.textContent=document.hidden?'WS: ПРИЗУПИНЕНО У ФОНІ':'WS: ВІДНОВЛЮЮ...';ws.className='warn';scheduleReconnect(Math.min(5000,750+reconnectCount*500))}}catch(e){sock=null;reconnectCount++;ws.textContent='WS: ПОМИЛКА';ws.className='bad';scheduleReconnect(3000)}}
async function wakeRecovery(){if(document.hidden)return;const ok=await health(false);if(ok){if(!sock||sock.readyState!==WebSocket.OPEN)connectLive(false)}else{ws.textContent='WS: GATEWAY НЕДОСТУПНИЙ';ws.className='bad'}}
ping.onclick=()=>health(true);tables.onclick=()=>run('/tables');read.onclick=()=>run('/read?table='+encodeURIComponent(table.value)+'&limit=20');live.onclick=()=>{if(sock)try{sock.close()}catch(e){};sock=null;connectLive(true)};
document.addEventListener('visibilitychange',()=>{if(!document.hidden)setTimeout(wakeRecovery,150)});window.addEventListener('pageshow',()=>setTimeout(wakeRecovery,150));window.addEventListener('online',()=>setTimeout(wakeRecovery,150));
setInterval(()=>{const now=Date.now(),packetAge=lastPacketAt?fmt((now-lastPacketAt)/1000):'—',wsAge=wsOpenedAt&&sock&&sock.readyState===WebSocket.OPEN?fmt((now-wsOpenedAt)/1000):'—';diag.textContent='PWA: '+fmt((now-pageStartedAt)/1000)+' · Gateway: '+(gatewayOK?'OK':'?')+' · WS: '+(sock&&sock.readyState===WebSocket.OPEN?'ON':'OFF')+' · WS час: '+wsAge+' · останній пакет: '+packetAge+' · reconnect: '+reconnectCount},1000);
(async()=>{await health(false);connectLive(false)})();
</script></body></html>
