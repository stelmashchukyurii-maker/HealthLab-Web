name: Wire Florivo live sensors
on:
  workflow_dispatch:
  push:
    paths:
      - 'florivo-chat/live-sensors.js'
jobs:
  wire:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - name: Add sensor script without replacing Florivo UI
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p=Path('florivo-chat/index.html')
          s=p.read_text()
          tag='<script src="./live-sensors.js?v=0.3.18"></script>'
          if tag not in s:
              s=s.replace('</body></html>',tag+'</body></html>')
          s=s.replace('HealthLab Agent</span><span class="version">v0.3.17</span>','HealthLab Agent</span><span class="version">v0.3.18</span>')
          p.write_text(s)
          PY
          git diff --check
          grep -q 'live-sensors.js?v=0.3.18' florivo-chat/index.html
          grep -q 'id="composer"' florivo-chat/index.html
          grep -q 'labDemoChartCard' florivo-chat/index.html
      - name: Commit additive wiring
        run: |
          if git diff --quiet; then exit 0; fi
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add florivo-chat/index.html
          git commit -m 'Florivo: wire live sensors into existing HealthLab tab'
          git push
